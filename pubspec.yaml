name: ramzan_app
description: "Ramadan Planner App with Prayer Times, Quran Tracker, Zikr, and Sunnah Learning"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Audio playback
  just_audio: ^0.9.31
  audio_service: ^0.18.10
  
  # Notifications
  flutter_local_notifications: ^16.3.2
  timezone: ^0.9.4
  
  # State management
  provider: ^6.1.1
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Date/Time
  intl: ^0.19.0
  
  # UI
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
