name: ramzan_app
description: "Ramadan Planner App with Prayer Times, Quran Tracker, Zikr, and Sunnah Learning"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Audio playback
  just_audio: ^0.9.31
  audio_service: ^0.18.10
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  
  # State management
  provider: ^6.1.1
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Date/Time
  intl: ^0.19.0
  
  # UI
  google_fonts: ^6.1.0

  # Video playback (for Bayans short video feed)
  video_player: ^2.8.2

  # HTTP / APIs
  http: ^1.1.0

  # Location (for Qibla Finder)
  geolocator: ^13.0.1

  # Compass (for live Qibla direction)
  flutter_compass: ^0.8.0

  # Supabase backend
  supabase_flutter: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/compass_arrow.png
    - assets/videos/
    - assets/icons/
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon/WhatsApp Image 2026-02-16 at 18.05.21.jpeg"
