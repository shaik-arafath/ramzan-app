name: halal_world
description: "Halal World - Islamic Shopping App with Prayer Times, Quran Tracker, Zikr, and Sunnah Learning"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Audio playback
  just_audio: ^0.9.31
  audio_service: ^0.18.10
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  
  # State management
  provider: ^6.1.1
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Date/Time
  intl: ^0.19.0
  
  # UI
  google_fonts: ^6.1.0

  # Video playback (for Bayans short video feed)
  video_player: ^2.8.2
  webview_flutter: ^4.4.2

  # HTTP / APIs
  http: ^1.1.0
  url_launcher: ^6.3.0
  image_picker: ^1.0.7

  # Location (for Qibla Finder)
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # Compass (for live Qibla direction)
  flutter_compass: ^0.8.0

  # Supabase backend
  supabase_flutter: ^2.5.6

dependency_overrides:
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/compass_arrow.png
    - assets/app_icon.png
    - assets/icon.png
    - assets/splash.png
    - assets/transparent.png
    - assets/Picsart_26-10-11_23-49-02-904.jpg
    - assets/Picsart_26-10-17_20-21-38-863.png
    - assets/Picsart_26-10-25_03-46-14-188.png
    - assets/edited-photo (5).png
    - assets/edited-photo (6).png
    - assets/AccountQRCodeState Bank of India - 9292_DARK_THEME.png
    - assets/d62aa914187bb01b0f7053eae30ff6d1.jpg
    - assets/eeb232de024d77f9de9b0b4dfc96c3bf.jpg
    - assets/7e789cf542209fc49a5582b23347764d.jpg
    - assets/audio/
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#111111"
  adaptive_icon_foreground: "assets/icon.png"
  adaptive_icon_foreground_inset: 28
  remove_alpha_ios: true

flutter_native_splash:
  color: "#111111"
  image: assets/splash.png
  android: true
  ios: true
  android_gravity: fill
  android_12:
    color: "#111111"
    image: assets/transparent.png
    icon_background_color: "#111111"
